name: 버그 리포트
description: 잘못된 매칭, 빠진 기관, 빌드 오류 등 버그 신고
labels: ["bug"]
body:
  - type: input
    id: input
    attributes:
      label: 입력 계좌번호 (마스킹 가능)
      placeholder: "110-***-***740"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 결과
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 결과
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 패키지 버전
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: 환경 (Node 버전, 번들러)
